<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In - Sri Kalyani Mobiles</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url('images/neon.gif') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .logo-top-left {
      position: absolute;
      top: 20px;
      left: 20px;
      text-align: center;
      z-index: 2;
    }

    .logo-top-left img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
    }

    .logo-top-left .brand-name {
      color: white;
      font-weight: bold;
      font-size: 16px;
      margin-top: 5px;
    }

    .back-home {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .back-home:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .signin-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: center;
      width: 350px;
      color: #fff;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signin-box h2 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #b11199;
      animation: slideIn 0.5s ease-in-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .signin-box input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 16px;
      transition: background 0.3s, transform 0.3s;
    }

    .signin-box input::placeholder {
      color: #ddd;
    }

    .signin-box input:focus {
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      transform: scale(1.05);
    }

    .signin-box button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background-color: #4000ff;
      color: #1e1e2f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s;
    }

    .signin-box button:hover {
      background-color: #d425dd;
      transform: scale(1.05);
    }

    @media (max-width: 400px) {
      .signin-box {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Logo Top Left -->
  <div class="logo-top-left">
    <img src="images/logo.png" alt="Logo">
    <div class="brand-name">SKM</div>
  </div>

  <!-- Back to Home -->
  <a href="index.html" class="back-home">← Back to Home</a>

  <!-- Sign In Box -->
  <div class="signin-box">
    <h2>Sign In</h2>
    <form method="POST" action="signin.php">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>

</body>
</html>
