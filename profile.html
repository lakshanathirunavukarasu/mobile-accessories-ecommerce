<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile - SKM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f3f3f3, #e0e0e0);
    }

    /* Top Navbar */
    .navbar {
      background-color: #005bea;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar .logo {
      font-size: 20px;
      font-weight: bold;
    }

    /* Profile Dropdown */
    .profile-menu {
      position: relative;
      display: inline-block;
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
    }

    .dropdown {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 180px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
      border-radius: 10px;
      padding: 10px;
      z-index: 999;
    }

    .dropdown a {
      display: block;
      padding: 10px;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }

    .dropdown a:hover {
      background-color: #f0f0f0;
    }

    .dropdown p {
      margin: 0 0 10px 0;
      padding: 0 10px;
      font-size: 15px;
      color: #444;
    }

    /* Profile Page Layout */
    .container {
      max-width: 800px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .profile-header img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #005bea;
    }

    .profile-info h2 {
      margin: 0;
      color: #333;
    }

    .profile-info p {
      margin: 5px 0;
      color: #666;
    }

    .logout-btn {
      margin-top: 30px;
      display: inline-block;
      background: #7e0c10;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .logout-btn:hover {
      background: #b8141c;
    }

    .back-home {
      display: inline-block;
      margin-top: 15px;
      color: #005bea;
      text-decoration: none;
      font-size: 14px;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .profile-header {
        flex-direction: column;
        align-items: center;
      }

      .profile-header img {
        width: 80px;
        height: 80px;
      }

      .container {
        margin: 30px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="navbar">
    <div class="logo">Sri Kalyani Mobiles</div>
    <div class="profile-menu">
      <img src="images/profile.png" alt="Profile" class="profile-icon" onclick="toggleDropdown()" />
      <div class="dropdown" id="profileDropdown">
        <p><strong id="dropdownUser">User</strong></p>
        <a href="profile.html"><i class="fas fa-user"></i> My Profile</a>
        <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </div>
  </div>

  <!-- Full Profile Section -->
  <div class="container">
    <div class="profile-header">
      <img src="images/profile.png" alt="Profile Picture" onerror="this.src='images/default-user.png';">
      <div class="profile-info">
        <h2 id="userName">User</h2>
        <p id="userEmail">Email: example@example.com</p>
        <p id="userSince">Member since: --</p>
      </div>
    </div>

    <a href="#" onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    <br>
    <a href="index.html" class="back-home">← Back to Home</a>
  </div>

  <script>
    // Load user from localStorage
    const user = JSON.parse(localStorage.getItem('user'));

    if (user) {
      document.getElementById('userName').innerText = user.name;
      document.getElementById('userEmail').innerText = "Email: " + user.email;
      document.getElementById('userSince').innerText = "Member since: " + (user.created_at || "N/A");
      document.getElementById('dropdownUser').innerText = user.name;
    } else {
      alert("User not logged in!");
      window.location.href = "login.html";
    }

    // Dropdown toggle
    function toggleDropdown() {
      const dropdown = document.getElementById("profileDropdown");
      dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
    }

    // Close dropdown if clicked outside
    window.onclick = function(event) {
      if (!event.target.matches('.profile-icon')) {
        const dropdown = document.getElementById("profileDropdown");
        if (dropdown) dropdown.style.display = "none";
      }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
